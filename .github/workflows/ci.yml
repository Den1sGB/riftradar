name: RiftRadar CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: Backend (Java 21 + Testcontainers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - name: Run unit and integration tests
        working-directory: backend
        run: ./mvnw verify -B

  frontend:
    name: Frontend (TypeScript + Vitest + Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Typecheck, test, and build
        working-directory: frontend
        run: |
          npm run typecheck
          npm test
          npm run build

  container-security:
    name: Container Build & Vulnerability Scan
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t riftradar-backend:ci ./backend
      - name: Build frontend image
        run: docker build -t riftradar-frontend:ci ./frontend
      - name: Scan backend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: riftradar-backend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Scan frontend image with Trivy
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: riftradar-frontend:ci
          severity: HIGH,CRITICAL
          exit-code: "1"
