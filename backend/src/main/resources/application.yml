spring:
  application:
    name: riftradar-backend
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2s

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  error:
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

riftradar:
  jwt:
    secret: ${JWT_SECRET}
    issuer: ${JWT_ISSUER:riftradar}
    access-ttl-seconds: ${JWT_ACCESS_TTL_SECONDS:900}
    refresh-ttl-seconds: ${JWT_REFRESH_TTL_SECONDS:604800}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8080}
  rate-limit:
    enabled: ${RATE_LIMIT_ENABLED:true}
    public-requests-per-minute: ${RATE_LIMIT_PUBLIC_RPM:30}
    auth-requests-per-minute: ${RATE_LIMIT_AUTH_RPM:60}
    riot-requests-per-minute: ${RATE_LIMIT_RIOT_RPM:40}
  riot:
    mode: ${RIOT_GATEWAY_MODE:mock}
    api-key: ${RIOT_API_KEY:}
    default-platform: ${RIOT_DEFAULT_PLATFORM:BR1}
    default-routing: ${RIOT_DEFAULT_ROUTING:AMERICAS}
    summoner-cache-ttl-seconds: 300
    match-cache-ttl-seconds: 86400
    connect-timeout-ms: 3000
    read-timeout-ms: 5000

logging:
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{correlationId:-none}] %logger{36} - %msg%n"
